name: pubblica dopo CI

on:
  workflow_run:
    workflows: [contracts]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: version
        name: Assegna una versione univoca al commit verificato
        env:
          CI_RUN: ${{ github.event.workflow_run.run_number }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, tomllib

          with open("core/server/Cargo.toml", "rb") as manifest:
              major, minor, patch = map(int, tomllib.load(manifest)["package"]["version"].split("."))
          patch += int(os.environ["CI_RUN"])
          if max(major, minor, patch) > 65535:
              raise SystemExit("Versione incompatibile con l’installer Windows")
          print(f"tag=v{major}.{minor}.{patch}")
          PY
  release:
    needs: version
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      commit: ${{ github.event.workflow_run.head_sha }}
      automatico: true
    secrets:
      JARVIS_MACOS_SIGNING_P12_BASE64: ${{ secrets.JARVIS_MACOS_SIGNING_P12_BASE64 }}
      JARVIS_MACOS_SIGNING_PASSWORD: ${{ secrets.JARVIS_MACOS_SIGNING_PASSWORD }}
      JARVIS_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.JARVIS_WINDOWS_SIGNING_PFX_BASE64 }}
      JARVIS_WINDOWS_SIGNING_PASSWORD: ${{ secrets.JARVIS_WINDOWS_SIGNING_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
