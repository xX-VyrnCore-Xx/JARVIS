name: contracts

on:
  push:
    branches: ["**"]
  pull_request:
    paths: ["contracts/**", "tests/**", "core/**", "ai/**", "apps/**", "jarvis.sh", "jarvis.ps1", "jarvis.cmd", ".github/workflows/**", "scripts/**"]

permissions:
  contents: read

jobs:
  android:
    name: Android (client e APK release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14.3"
      - name: Firma di prova temporanea per validare la variante release
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/jarvis-ci.jks" \
            -storepass ci-only-password -keypass ci-only-password -alias ci-only \
            -dname "CN=JARVIS CI,OU=Test,O=JARVIS,C=IT" -keyalg RSA -keysize 2048 -validity 2
          gradle -p apps/android --no-daemon :core-client:test :app:assembleRelease \
            -PjarvisReleaseStoreFile="$RUNNER_TEMP/jarvis-ci.jks" \
            -PjarvisReleaseStorePassword=ci-only-password \
            -PjarvisReleaseKeyAlias=ci-only \
            -PjarvisReleaseKeyPassword=ci-only-password
      - name: Verifica firma e nome dell'APK release
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          test ! -e apps/android/app/build/outputs/apk/debug/app-debug.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner non trovato negli Android SDK build-tools."
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"

  validate:
    name: validate (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python -m unittest discover -s tests/contracts -v
      - run: python -m unittest discover -s tests/ai -v

  rust:
    name: validate (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Dipendenze del worker Python usato dai test del bridge
        run: python -m pip install -r ../tests/contracts/requirements.txt
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  e2e:
    name: e2e (API native e dispositivi)
    runs-on: ubuntu-latest
    needs: [validate, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/contracts/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Compila il Core
        working-directory: core
        run: cargo build --release --locked -p jarvis-core
      - name: Avvia JARVIS in modalità offline
        run: |
          JARVIS_PYTHON=python JARVIS_DATA_DIR="$RUNNER_TEMP/jarvis" JARVIS_PORT=8765 JARVIS_TOKEN=jarvise2eownertoken0000000000000000 \
          JARVIS_ALLOWED_HOSTS=jarvis.test JARVIS_VOICE_ENGINE=fake JARVIS_SETUP_FAKE=1 \
            core/target/release/jarvis > "$RUNNER_TEMP/jarvis.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8765/api/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/jarvis.log"; exit 1
      - run: JARVIS_URL=http://127.0.0.1:8765 JARVIS_TOKEN=jarvise2eownertoken0000000000000000 node tests/e2e/api_smoke.cjs

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Librerie grafiche egui (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libgl1-mesa-dev libdbus-1-dev
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked


  audit:
    name: audit delle dipendenze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Vulnerabilità note nelle dipendenze Rust (RustSec)
        run: |
          cargo install cargo-audit --locked --quiet
          (cd core && cargo audit)
          (cd apps/desktop/src-tauri && cargo audit)
      - name: Vulnerabilità note nelle dipendenze Python
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r tests/contracts/requirements.txt
          pip-audit -r ai/requirements-voice.txt

  avvio:
    name: avvio reale (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Portachiavi del sistema su macOS e Windows, file 0600 su Linux (ADR-0021).
      JARVIS_EXPECT_SECRETS_STORE: ${{ matrix.os == 'ubuntu-latest' && 'file' || 'keychain' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Avvio con jarvis.sh (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./jarvis.sh > jarvis.log 2>&1 &
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 1200 || { cat jarvis.log; exit 1; }
          python tests/perf/latency.py http://127.0.0.1:8765 30
      - name: Avvio con jarvis.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Analisi sintattica con Windows PowerShell 5.1 (quello del doppio clic): fallisce subito invece di attendere.
          powershell -NoProfile -Command "`$e = `$null; [void][System.Management.Automation.Language.Parser]::ParseFile('jarvis.ps1', [ref]`$null, [ref]`$e); if (`$e) { `$e; exit 1 }"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','jarvis.ps1' -RedirectStandardOutput jarvis.log -RedirectStandardError jarvis.err -PassThru -NoNewWindow
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 1500
          if ($LASTEXITCODE -ne 0) { Get-Content jarvis.log, jarvis.err; exit 1 }
