name: contracts

on:
  push:
    paths: ["contracts/**", "tests/contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", "tests/contracts/**", ".github/workflows/contracts.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python -m unittest discover -s tests/contracts -v
