name: contracts

on:
  push:
    paths: ["contracts/**", "tests/**", "core/**", "ai/**", "apps/**", "jarvis.sh", "jarvis.ps1", "jarvis.cmd", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", "tests/**", "core/**", "ai/**", "apps/**", "jarvis.sh", "jarvis.ps1", "jarvis.cmd", ".github/workflows/contracts.yml"]

permissions:
  contents: read

jobs:
  ios:
    name: iOS (client e build simulatore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verifica il client del Core
        run: |
          swiftc apps/ios/Jarvis/CoreClient.swift apps/ios/tests/CoreClientTests.swift -o "$RUNNER_TEMP/core-client-tests"
          "$RUNNER_TEMP/core-client-tests"
      - name: Compila JARVIS per simulatore
        run: |
          xcodebuild -project apps/ios/JARVIS.xcodeproj -scheme JARVIS -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/jarvis-ios" CODE_SIGNING_ALLOWED=NO build

  android:
    name: Android (client e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test del client del Core e APK di debug
        run: gradle -p apps/android --no-daemon :core-client:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk

  validate:
    name: validate (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python -m unittest discover -s tests/contracts -v
      - run: python -m unittest discover -s tests/ai -v

  rust:
    name: validate (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dipendenze del worker Python usato dai test del bridge
        run: python -m pip install -r ../tests/contracts/requirements.txt
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  e2e:
    name: e2e (interfaccia)
    runs-on: ubuntu-latest
    needs: [validate, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/contracts/requirements.txt
      - name: Compila il Core
        working-directory: core
        run: cargo build --release --locked -p jarvis-core
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/ui/audio_offline.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Avvia JARVIS in modalità offline
        run: |
          JARVIS_AI_BACKEND=offline JARVIS_PYTHON=python JARVIS_DATA_DIR="$RUNNER_TEMP/jarvis" JARVIS_PORT=8765 \
          JARVIS_WEB_ALLOW_PRIVATE=1 JARVIS_WIKIPEDIA_URL=http://127.0.0.1:8799 JARVIS_WEB_DENY=vietato.localhost JARVIS_ALLOWED_HOSTS=jarvis.test \
          JARVIS_VOICE_ENGINE=fake JARVIS_FAKE_STT_TEXT="che ore sono" \
            core/target/release/jarvis > "$RUNNER_TEMP/jarvis.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8765/api/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/jarvis.log"; exit 1
      - run: mkdir -p screenshots && JARVIS_URL=http://localhost:8765 node tests/e2e/ui_smoke.cjs screenshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Librerie WebKitGTK (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --locked


  audit:
    name: audit delle dipendenze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vulnerabilità note nelle dipendenze Rust (RustSec)
        run: |
          cargo install cargo-audit --locked --quiet
          (cd core && cargo audit)
          (cd apps/desktop/src-tauri && cargo audit)
      - name: Vulnerabilità note nelle dipendenze Python
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r tests/contracts/requirements.txt
          pip-audit -r ai/requirements-voice.txt

  avvio:
    name: avvio reale (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      JARVIS_NO_BROWSER: "1"
      JARVIS_AI_BACKEND: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Avvio con jarvis.sh (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./jarvis.sh > jarvis.log 2>&1 &
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 1200 || { cat jarvis.log; exit 1; }
          python tests/perf/latency.py http://127.0.0.1:8765 30
      - name: Avvio con jarvis.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Analisi sintattica con Windows PowerShell 5.1 (quello del doppio clic): fallisce subito invece di attendere.
          powershell -NoProfile -Command "`$e = `$null; [void][System.Management.Automation.Language.Parser]::ParseFile('jarvis.ps1', [ref]`$null, [ref]`$e); if (`$e) { `$e; exit 1 }"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','jarvis.ps1' -RedirectStandardOutput jarvis.log -RedirectStandardError jarvis.err -PassThru -NoNewWindow
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 1500
          if ($LASTEXITCODE -ne 0) { Get-Content jarvis.log, jarvis.err; exit 1 }
