name: contracts

on:
  push:
    paths: ["contracts/**", "tests/**", "core/**", "ai/**", "apps/**", "jarvis.sh", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", "tests/**", "core/**", "ai/**", "apps/**", "jarvis.sh", ".github/workflows/contracts.yml"]

permissions:
  contents: read

jobs:
  validate:
    name: validate (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python -m unittest discover -s tests/contracts -v
      - run: python -m unittest discover -s tests/ai -v

  rust:
    name: validate (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dipendenze del worker Python usato dai test del bridge
        run: python -m pip install -r ../tests/contracts/requirements.txt
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  e2e:
    name: e2e (interfaccia)
    runs-on: ubuntu-latest
    needs: [validate, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/contracts/requirements.txt
      - name: Compila il Core
        working-directory: core
        run: cargo build --release --locked -p jarvis-core
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Avvia JARVIS in modalità offline
        run: |
          JARVIS_AI_BACKEND=offline JARVIS_PYTHON=python JARVIS_DATA_DIR="$RUNNER_TEMP/jarvis" JARVIS_PORT=8765 \
          JARVIS_WEB_ALLOW_PRIVATE=1 JARVIS_WIKIPEDIA_URL=http://127.0.0.1:8799 JARVIS_WEB_DENY=vietato.localhost \
            core/target/release/jarvis > "$RUNNER_TEMP/jarvis.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8765/api/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/jarvis.log"; exit 1
      - run: mkdir -p screenshots && JARVIS_URL=http://localhost:8765 node tests/e2e/ui_smoke.cjs screenshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Librerie WebKitGTK (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --locked

