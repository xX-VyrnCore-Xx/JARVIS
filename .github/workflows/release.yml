name: release

# Archivi di release per Linux, macOS e Windows (Fase 7, ADR-0015). Ogni archivio viene estratto e avviato
# con il proprio lanciatore senza Rust. Con un tag vX.Y.Z pubblica la release con archivi e impronte
# (decisione del proprietario del 2026-11-17); i tag con suffisso, es. v1.0.0-rc.1, restano prerelease.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["scripts/package.py", ".github/workflows/release.yml", "jarvis.sh", "jarvis.ps1", "core/server/src/main.rs", "core/server/src/rollback.rs"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da creare e pubblicare (es. v0.1.0): deve corrispondere alla versione del Core. Vuoto = solo archivi"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: archivio (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, bin: jarvis }
          - { os: macos-latest, target: macos-aarch64, bin: jarvis }
          - { os: windows-latest, target: windows-x86_64, bin: jarvis.exe }
    runs-on: ${{ matrix.os }}
    env:
      JARVIS_NO_BROWSER: "1"
      JARVIS_AI_BACKEND: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Core in modalità release
        working-directory: core
        run: cargo build --release --locked -p jarvis-core
      - name: Archivio e impronta
        run: python scripts/package.py --binary core/target/release/${{ matrix.bin }} --target ${{ matrix.target }} --out dist
      - name: Avvio dall'archivio (Linux, macOS), senza i sorgenti del Core
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/prova" && tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/prova"
          (cd dist && shasum -a 256 -c *.sha256)
          cd "$RUNNER_TEMP"/prova/jarvis-*
          test ! -e core
          ./jarvis.sh > jarvis.log 2>&1 &
          python "$GITHUB_WORKSPACE/tests/smoke/start_smoke.py" http://127.0.0.1:8765 300 || { cat jarvis.log; exit 1; }
          grep -q "Core precompilato" jarvis.log
      - name: Avvio dall'archivio (Windows), senza i sorgenti del Core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "prova"
          Expand-Archive -Path (Get-Item dist\*.zip).FullName -DestinationPath $dest
          $dir = (Get-ChildItem $dest -Directory)[0].FullName
          if (Test-Path (Join-Path $dir "core")) { exit 1 }
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',(Join-Path $dir 'jarvis.ps1') -WorkingDirectory $dir -RedirectStandardOutput (Join-Path $dir 'jarvis.log') -RedirectStandardError (Join-Path $dir 'jarvis.err') -PassThru -NoNewWindow
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 300
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $dir 'jarvis.log'), (Join-Path $dir 'jarvis.err'); exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.target }}
          path: dist/

  publish:
    name: pubblicazione della release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag coerente con la versione del Core
        id: tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "tag non valido: $TAG"; exit 1; }
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' core/server/Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "il tag $TAG non corrisponde alla versione $version"; exit 1; }
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release pubblica con archivi e impronte SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          extra=""
          case "$TAG" in *-*) extra="--prerelease" ;; esac
          # Con l'avvio manuale il tag non esiste ancora: gh lo crea sul commit costruito.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes --title "JARVIS $TAG" $extra --repo "$GITHUB_REPOSITORY"
