name: release

# Installer macOS (.dmg per Apple Silicon) e Windows (setup .exe), con Core,
# runtime AI e Python autonomo inclusi. Ogni installer viene installato e il Core supera la prova di avvio.
# Aggiunge l'APK Android release, firmato con il keystore persistente del proprietario.
# Con un tag vX.Y.Z pubblica la release con installer e impronte (decisione del proprietario del 2026-11-17); i tag con suffisso, es. v1.0.0-rc.1, restano prerelease.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["scripts/fetch_python.py", ".github/workflows/release.yml", "scripts/sign_macos_release.sh", "apps/desktop/**", "core/server/src/main.rs", "core/server/src/rollback.rs"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
      automatico:
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_ISSUER:
        required: false
      JARVIS_APPLE_API_KEY_BASE64:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da creare e pubblicare (es. v0.1.0): deve corrispondere alla versione del Core. Vuoto = solo archivi"
        required: false
        default: ""
      commit:
        description: "Commit verificato da usare per una pubblicazione automatica"
        required: false
        default: ""
      sostituisci:
        description: "Se la release del tag esiste già, la elimina con il suo tag e la ricrea sul commit costruito"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: installer (${{ matrix.target }})
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos-aarch64, bundles: "dmg" }
          - { os: windows-latest, target: windows-x86_64, bundles: "nsis" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GITHUB_TOKEN: ${{ github.token }}
      NATIVE_SIGNING: ${{ inputs.automatico && vars.JARVIS_NATIVE_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Imposta la versione automatica degli installer
        if: inputs.automatico
        env:
          TAG: ${{ inputs.tag }}
        run: python scripts/stamp_release.py "$TAG"
        shell: bash
      - name: Core in modalità release, incluso come sidecar
        shell: bash
        run: |
          (cd core && cargo build --release --locked -p jarvis-core)
          triple=$(rustc -vV | sed -n 's/host: //p')
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          cp "core/target/release/jarvis$ext" "apps/desktop/src-tauri/binaries/jarvis-core-$triple$ext"
          echo "TRIPLE=$triple" >> "$GITHUB_ENV"
      - name: Python autonomo con le dipendenze del runtime AI
        shell: bash
        run: |
          python scripts/fetch_python.py --triple "$TRIPLE" --dest apps/desktop/src-tauri/python
          if [ "$RUNNER_OS" = "Windows" ]; then py=apps/desktop/src-tauri/python/python.exe; else py=apps/desktop/src-tauri/python/bin/python3; fi
          "$py" -m pip install --disable-pip-version-check -q -r tests/contracts/requirements.txt
          python scripts/fetch_python.py --triple "$TRIPLE" --dest apps/desktop/src-tauri/python --trim
          "$py" -c "import jsonschema, sys; print('Python incluso', sys.version.split()[0])"
          du -sh apps/desktop/src-tauri/python apps/desktop/src-tauri/binaries || true
          find apps/desktop/src-tauri/python -type l | head -5 | grep . && { echo "collegamenti simbolici residui"; exit 1; } || true
      - name: La voce si installa con il Python incluso (come fa la configurazione guidata)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=apps/desktop/src-tauri/python/python.exe; else py=apps/desktop/src-tauri/python/bin/python3; fi
          "$py" -m pip install --disable-pip-version-check --require-hashes -q --target "$RUNNER_TEMP/voce" -r ai/requirements-voice.txt
          PYTHONPATH="$RUNNER_TEMP/voce" "$py" -c "import faster_whisper, piper, openwakeword, onnxruntime; print('pacchetti della voce importati')"
      - name: CLI Tauri
        run: npm install --global --no-audit --no-fund @tauri-apps/cli@2.12.6
      - name: Programmi di installazione (Tauri)
        if: runner.os != 'macOS' || env.NATIVE_SIGNING != 'true'
        working-directory: apps/desktop/src-tauri
        shell: bash
        # CLI installato in modo esplicito: con npx il modulo nativo opzionale a volte non viene scaricato
        # (MODULE_NOT_FOUND su Windows). Il pacchetto nativo dipende dal sistema e npm lo sceglie da solo.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Con CI=true Tauri salta l'impaginazione del .dmg (sfondo, posizione delle icone, ADR-0036): la si
            # chiede esplicitamente e, se Finder non risponde sul runner, si ripiega sul .dmg senza impaginazione.
            CI=false tauri build --config tauri.bundle.conf.json --bundles ${{ matrix.bundles }} || {
              echo "::warning::impaginazione del .dmg non riuscita, nuovo tentativo senza"
              tauri build --config tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
            }
          else
            tauri build --config tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
          fi
      - name: Firma Developer ID e notarizzazione del DMG
        if: runner.os == 'macOS' && env.NATIVE_SIGNING == 'true'
        working-directory: apps/desktop/src-tauri
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          JARVIS_APPLE_API_KEY_BASE64: ${{ secrets.JARVIS_APPLE_API_KEY_BASE64 }}
        run: bash ../../../scripts/sign_macos_release.sh
      - name: Autenticazione Azure per Authenticode
        if: runner.os == 'Windows' && env.NATIVE_SIGNING == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Firma e marca temporale del setup Windows
        if: runner.os == 'Windows' && env.NATIVE_SIGNING == 'true'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/apps/desktop/src-tauri/target/release/bundle/nsis
          files-folder-filter: '*-setup.exe'
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Installazione dal .dmg e avvio del Core installato (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          ls -la "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/dmg/.background" 2>/dev/null || echo "::warning::.dmg senza sfondo"
          test -L "$RUNNER_TEMP/dmg/Applications" || { echo "manca il collegamento ad Applicazioni nel .dmg"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$RUNNER_TEMP/dmg/JARVIS.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          app="$RUNNER_TEMP/Applications/JARVIS.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist"
          if [ "$NATIVE_SIGNING" = "true" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi
          res="$app/Contents/Resources"
          test -x "$app/Contents/MacOS/jarvis-core" && test -x "$res/python/bin/python3"
          JARVIS_HOME="$res" JARVIS_PYTHON="$res/python/bin/python3" JARVIS_DATA_DIR="$RUNNER_TEMP/dati" "$app/Contents/MacOS/jarvis-core" > core.log 2>&1 &
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 120 || { cat core.log; exit 1; }
      - name: Installazione reale (setup EXE) e avvio del Core installato (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)[0].FullName
          if ($env:NATIVE_SIGNING -eq 'true') {
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              throw "Firma Authenticode non valida o priva di marca temporale: $($signature.Status)"
            }
          }
          $root = Join-Path $env:RUNNER_TEMP 'JARVIS-installato'
          # Per NSIS /D deve essere l'ultimo argomento e va passato senza virgolette.
          $p = Start-Process -FilePath $setup -ArgumentList "/S /D=$root" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installazione non riuscita: $($p.ExitCode)" }
          $core = Get-Item "$root\jarvis-core.exe"
          if (-not (Test-Path "$root\python\python.exe")) { throw "Python incluso assente in $root" }
          $env:JARVIS_HOME = $root; $env:JARVIS_PYTHON = "$root\python\python.exe"; $env:JARVIS_DATA_DIR = "$env:RUNNER_TEMP\dati"
          Start-Process -FilePath $core.FullName -RedirectStandardOutput core.log -RedirectStandardError core.err -NoNewWindow
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 120
          if ($LASTEXITCODE -ne 0) { Get-Content core.log, core.err; exit 1 }
      - name: Installer da pubblicare
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle \( -name '*.dmg' -o -name '*-setup.exe' \) -type f -exec cp {} dist/ \;
          test "$(find dist -type f | wc -l)" -eq 1
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jarvis-${{ matrix.target }}
          path: dist/

  android:
    name: APK Android release
    if: inputs.automatico || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Imposta la versione automatica Android
        if: inputs.automatico
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/stamp_release.py "$TAG"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14.3"
      - name: Configura il keystore persistente
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] ||
             [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configura ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD."
            exit 1
          fi
          keystore="$RUNNER_TEMP/jarvis-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          {
            echo "ORG_GRADLE_PROJECT_jarvisReleaseStoreFile=$keystore"
            echo "ORG_GRADLE_PROJECT_jarvisReleaseStorePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_jarvisReleaseKeyAlias=$ANDROID_KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_jarvisReleaseKeyPassword=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Compila l'APK firmato e verifica l'identità di firma
        run: |
          gradle -p apps/android --no-daemon :core-client:test :app:assembleRelease
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner verify --verbose --print-certs "$apk"
      - name: Nomina l'APK e calcola l'impronta
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk "dist/JARVIS_${version}_android-release.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jarvis-android
          path: dist/

  publish:
    name: pubblicazione della release
    if: inputs.automatico || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Imposta la versione automatica per la verifica
        if: inputs.automatico
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/stamp_release.py "$TAG"
      - name: Tag coerente con la versione del Core
        id: tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "tag non valido: $TAG"; exit 1; }
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' core/server/Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "il tag $TAG non corrisponde alla versione $version"; exit 1; }
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Verifica dei pacchetti e impronte SHA-256
        working-directory: dist
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${TAG#v}"
          installers=("JARVIS_${version}_aarch64.dmg" "JARVIS_${version}_x64-setup.exe" "JARVIS_${version}_android-release.apk")
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#installers[@]}"
          for installer in "${installers[@]}"; do test -s "$installer"; done
          sha256sum -- "${installers[@]}" > SHA256SUMS
          cat SHA256SUMS
      # Firma senza chiavi da custodire (ADR-0020): attestazione di provenienza di GitHub per ogni installer e
      # firma Sigstore dell'elenco delle impronte, legate a questo workflow e a questo commit.
      - name: Attestazione di provenienza degli installer
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*_android-release.apk
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Firma e verifica Sigstore dei pacchetti e delle impronte
        working-directory: dist
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          for file in *.dmg *-setup.exe *_android-release.apk SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
      - name: Release pubblica con installer, impronte e firme
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          AUTOMATIC: ${{ inputs.automatico }}
          NATIVE_SIGNING: ${{ inputs.automatico && vars.JARVIS_NATIVE_SIGNING == 'true' }}
          REPLACE: ${{ inputs.sostituisci && 'true' || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "$REPLACE" = "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "sostituzione della release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
            sleep 5
          fi
          remote=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [ -n "$remote" ]; then
            existing=$(printf '%s\n' "$remote" | tail -1 | cut -f1)
            test "$existing" = "$(git rev-parse HEAD)" || { echo "::error::Il tag appartiene a un altro commit"; exit 1; }
            if [ "$AUTOMATIC" = "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
          fi
          extra=""
          case "$TAG" in *-*) extra="--prerelease" ;; esac
          # Con l'avvio manuale il tag non esiste ancora: lo crea qui sul commit costruito (via git, così un
          # rifiuto riporta la regola che lo blocca), poi la release usa il tag esistente.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$(git rev-parse HEAD)"
            git push origin "refs/tags/$TAG" || {
              echo "::error::push del tag $TAG rifiutato; regole attive:"
              gh api "repos/$GITHUB_REPOSITORY/rulesets" || true
              exit 1
            }
          fi
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          cp .github/release-notes.md "$notes"
          if [ "$NATIVE_SIGNING" = "true" ]; then
            printf '\nFirma nativa verificata su entrambi i pacchetti: Developer ID con notarizzazione Apple e Authenticode con marca temporale.\n' >> "$notes"
          else
            printf '\nI pacchetti sono firmati con Sigstore e attestati da GitHub Actions. macOS usa una firma ad hoc per l’app.\n' >> "$notes"
          fi
          release_notes="$(<"$notes")"
          gh release create "$TAG" dist/* --verify-tag --notes "$release_notes" --generate-notes --title "JARVIS $TAG" $extra --repo "$GITHUB_REPOSITORY" || {
            echo "::error::creazione della release rifiutata; diagnosi:"
            gh api "repos/$GITHUB_REPOSITORY/rulesets" || true
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=3" --jq '.[].tag_name' || true
            exit 1
          }
      - name: Mantieni una sola release pubblicata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prune_releases.py "$GITHUB_REPOSITORY"
