name: release

# App nativa egui per macOS (.dmg per Apple Silicon) e Windows (setup .exe), con Core,
# runtime AI e Python autonomo inclusi. Ogni installer viene installato e il Core supera la prova di avvio.
# Aggiunge l'APK Android release, firmato con il keystore persistente del proprietario.
# Con un tag vX.Y.Z pubblica la release con installer e impronte (decisione del proprietario del 2026-11-17); i tag con suffisso, es. v1.0.0-rc.1, restano prerelease.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["ai/**", "contracts/**", "core/**", "scripts/fetch_python.py", "scripts/package_macos_release.sh", "scripts/package_windows_release.ps1", "scripts/stamp_release.py", ".github/workflows/release.yml", "apps/desktop/**"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
      automatico:
        type: boolean
        default: false
    secrets:
      JARVIS_MACOS_SIGNING_P12_BASE64:
        required: false
      JARVIS_MACOS_SIGNING_PASSWORD:
        required: false
      JARVIS_WINDOWS_SIGNING_PFX_BASE64:
        required: false
      JARVIS_WINDOWS_SIGNING_PASSWORD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da creare e pubblicare (es. v0.1.0): deve corrispondere alla versione del Core. Vuoto = solo archivi"
        required: false
        default: ""
      commit:
        description: "Commit verificato da usare per una pubblicazione automatica"
        required: false
        default: ""
      sostituisci:
        description: "Se la release del tag esiste già, la elimina con il suo tag e la ricrea sul commit costruito"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: installer (${{ matrix.target }})
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos-aarch64 }
          - { os: windows-latest, target: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GITHUB_TOKEN: ${{ github.token }}
      NATIVE_SIGNING: ${{ inputs.automatico || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Imposta la versione automatica degli installer
        if: inputs.automatico
        env:
          TAG: ${{ inputs.tag }}
        run: python scripts/stamp_release.py "$TAG"
        shell: bash
      - name: Core e risorse in modalità release
        shell: bash
        run: |
          (cd core && cargo build --release --locked -p jarvis-core)
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          resources=apps/desktop/src-tauri/resources
          mkdir -p "$resources/ai" "$resources/contracts"
          cp "core/target/release/jarvis$ext" "$resources/jarvis-core$ext"
          cp -R ai/jarvis_ai "$resources/ai/"
          cp ai/requirements-voice.txt "$resources/ai/requirements-voice.txt"
          cp -R contracts/. "$resources/contracts/"
          cp apps/desktop/src-tauri/icons/icon.ico "$resources/icon.ico"
      - name: Python autonomo con le dipendenze del runtime AI
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          python scripts/fetch_python.py --triple "$triple" --dest apps/desktop/src-tauri/resources/python
          if [ "$RUNNER_OS" = "Windows" ]; then py=apps/desktop/src-tauri/resources/python/python.exe; else py=apps/desktop/src-tauri/resources/python/bin/python3; fi
          "$py" -m pip install --disable-pip-version-check -q -r tests/contracts/requirements.txt
          python scripts/fetch_python.py --triple "$triple" --dest apps/desktop/src-tauri/resources/python --trim
          "$py" -c "import jsonschema, sys; print('Python incluso', sys.version.split()[0])"
          du -sh apps/desktop/src-tauri/resources
          find apps/desktop/src-tauri/resources/python -type l | head -5 | grep . && { echo "collegamenti simbolici residui"; exit 1; } || true
      - name: Verifica le dipendenze vocali con il Python incluso
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=apps/desktop/src-tauri/resources/python/python.exe; else py=apps/desktop/src-tauri/resources/python/bin/python3; fi
          "$py" -m pip install --disable-pip-version-check --require-hashes -q --target "$RUNNER_TEMP/voce" -r ai/requirements-voice.txt
          PYTHONPATH="$RUNNER_TEMP/voce" "$py" -c "import faster_whisper, piper, openwakeword, onnxruntime; print('pacchetti della voce importati')"
      - name: Compila la GUI nativa
        shell: bash
        run: |
          cargo build --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Firma gli eseguibili Windows con il certificato privato
        if: runner.os == 'Windows' && env.NATIVE_SIGNING == 'true'
        shell: pwsh
        env:
          JARVIS_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.JARVIS_WINDOWS_SIGNING_PFX_BASE64 }}
          JARVIS_WINDOWS_SIGNING_PASSWORD: ${{ secrets.JARVIS_WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JARVIS_WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:JARVIS_WINDOWS_SIGNING_PASSWORD)) {
            throw "Configura il certificato PFX autofirmato Windows e la relativa password nei Secrets."
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'jarvis-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:JARVIS_WINDOWS_SIGNING_PFX_BASE64))
          Remove-Item Env:JARVIS_WINDOWS_SIGNING_PFX_BASE64
          $password = ConvertTo-SecureString $env:JARVIS_WINDOWS_SIGNING_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $publicCert = Join-Path $env:RUNNER_TEMP 'jarvis-signing.cer'
          Export-Certificate -Cert $certificate -FilePath $publicCert | Out-Null
          Import-Certificate -FilePath $publicCert -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe non trovato nel Windows SDK." }
          $executables = @((Resolve-Path apps/desktop/src-tauri/target/release/jarvis-desktop.exe).Path)
          $executables += Get-ChildItem apps/desktop/src-tauri/resources -Filter *.exe -Recurse |
            ForEach-Object { $_.FullName }
          foreach ($executable in $executables) {
            & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint $executable
            if ($LASTEXITCODE -ne 0) { throw "Firma non riuscita: $executable" }
            & $signtool.FullName verify /pa $executable
            if ($LASTEXITCODE -ne 0) { throw "Verifica firma non riuscita: $executable" }
          }
          Remove-Item Env:JARVIS_WINDOWS_SIGNING_PASSWORD
          Remove-Item -LiteralPath $pfx -Force
          "JARVIS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Crea e firma app macOS e DMG
        if: runner.os == 'macOS'
        env:
          NATIVE_SIGNING: ${{ env.NATIVE_SIGNING }}
          JARVIS_MACOS_SIGNING_P12_BASE64: ${{ secrets.JARVIS_MACOS_SIGNING_P12_BASE64 }}
          JARVIS_MACOS_SIGNING_PASSWORD: ${{ secrets.JARVIS_MACOS_SIGNING_PASSWORD }}
          JARVIS_MACOS_SIGNING_IDENTITY: ${{ vars.JARVIS_MACOS_SIGNING_IDENTITY }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          bash scripts/package_macos_release.sh "$version"
      - name: Installa NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $env:PATH = "$env:PATH;${env:ProgramFiles(x86)}\NSIS"
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "makensis.exe non è disponibile dopo l'installazione di NSIS"
          }
      - name: Crea setup Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;${env:ProgramFiles(x86)}\NSIS"
          ./scripts/package_windows_release.ps1
      - name: Firma privata del setup Windows
        if: runner.os == 'Windows' && env.NATIVE_SIGNING == 'true'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)[0].FullName
          $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe non trovato nel Windows SDK." }
          & $signtool.FullName sign /fd SHA256 /sha1 $env:JARVIS_SIGNING_THUMBPRINT $setup
          if ($LASTEXITCODE -ne 0) { throw "Firma Authenticode autofirmata non riuscita." }
          & $signtool.FullName verify /pa $setup
          if ($LASTEXITCODE -ne 0) { throw "Verifica della firma Authenticode non riuscita." }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid') { throw "Firma Authenticode non valida: $($signature.Status)" }
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:JARVIS_SIGNING_THUMBPRINT" -Force
          Remove-Item -LiteralPath "Cert:\CurrentUser\Root\$env:JARVIS_SIGNING_THUMBPRINT" -Force
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'jarvis-signing.cer') -Force
      - name: Installazione dal .dmg e avvio del Core installato (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          test -L "$RUNNER_TEMP/dmg/Applications" || { echo "manca il collegamento ad Applicazioni nel .dmg"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$RUNNER_TEMP/dmg/JARVIS.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          app="$RUNNER_TEMP/Applications/JARVIS.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist"
          res="$app/Contents/Resources"
          test -x "$res/jarvis-core" && test -x "$res/python/bin/python3"
          export JARVIS_TOKEN=jarvise2eownertoken0000000000000000
          JARVIS_HOME="$res" JARVIS_PYTHON="$res/python/bin/python3" JARVIS_DATA_DIR="$RUNNER_TEMP/dati" "$res/jarvis-core" > core.log 2>&1 &
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 120 || { cat core.log; exit 1; }
      - name: Installazione reale (setup EXE) e avvio del Core installato (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)[0].FullName
          if ($env:NATIVE_SIGNING -eq 'true') {
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid') {
              throw "Firma Authenticode non valida: $($signature.Status)"
            }
          }
          $root = Join-Path $env:RUNNER_TEMP 'JARVIS-installato'
          # Per NSIS /D deve essere l'ultimo argomento e va passato senza virgolette.
          $p = Start-Process -FilePath $setup -ArgumentList "/S /D=$root" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installazione non riuscita: $($p.ExitCode)" }
          if (-not (Test-Path "$root\jarvis-desktop.exe")) { throw "GUI nativa non installata in $root" }
          $core = Get-Item "$root\resources\jarvis-core.exe"
          if (-not (Test-Path "$root\resources\python\python.exe")) { throw "Python incluso assente in $root" }
          $env:JARVIS_HOME = "$root\resources"; $env:JARVIS_PYTHON = "$root\resources\python\python.exe"; $env:JARVIS_DATA_DIR = "$env:RUNNER_TEMP\dati"
          $env:JARVIS_TOKEN = 'jarvise2eownertoken0000000000000000'
          Start-Process -FilePath $core.FullName -RedirectStandardOutput core.log -RedirectStandardError core.err -NoNewWindow
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 120
          if ($LASTEXITCODE -ne 0) { Get-Content core.log, core.err; exit 1 }
      - name: Installer da pubblicare
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle \( -name '*.dmg' -o -name '*-setup.exe' \) -type f -exec cp {} dist/ \;
          test "$(find dist -type f | wc -l)" -eq 1
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jarvis-${{ matrix.target }}
          path: dist/

  android:
    name: APK Android release
    if: inputs.automatico || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      JARVIS_FIREBASE_API_KEY: ${{ vars.JARVIS_FIREBASE_API_KEY }}
      JARVIS_FIREBASE_PROJECT_ID: ${{ vars.JARVIS_FIREBASE_PROJECT_ID }}
      JARVIS_FIREBASE_APP_ID: ${{ vars.JARVIS_FIREBASE_APP_ID }}
      JARVIS_FIREBASE_SENDER_ID: ${{ vars.JARVIS_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Imposta la versione automatica Android
        if: inputs.automatico
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/stamp_release.py "$TAG"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: "8.14.3"
      - name: Configura il keystore persistente
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] ||
             [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configura ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD."
            exit 1
          fi
          keystore="$RUNNER_TEMP/jarvis-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          {
            echo "ORG_GRADLE_PROJECT_jarvisReleaseStoreFile=$keystore"
            echo "ORG_GRADLE_PROJECT_jarvisReleaseStorePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_jarvisReleaseKeyAlias=$ANDROID_KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_jarvisReleaseKeyPassword=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Compila l'APK firmato e verifica l'identità di firma
        shell: bash
        run: |
          configured=0
          [ -n "$JARVIS_FIREBASE_API_KEY" ] && configured=$((configured + 1))
          [ -n "$JARVIS_FIREBASE_PROJECT_ID" ] && configured=$((configured + 1))
          [ -n "$JARVIS_FIREBASE_APP_ID" ] && configured=$((configured + 1))
          [ -n "$JARVIS_FIREBASE_SENDER_ID" ] && configured=$((configured + 1))
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "::error::Configura tutte e quattro le variabili Firebase Android oppure lasciale vuote."
            exit 1
          fi
          gradle -p apps/android --no-daemon :core-client:test :app:assembleRelease
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner non trovato negli Android SDK build-tools."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
      - name: Nomina l'APK e calcola l'impronta
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk "dist/JARVIS_${version}_android-release.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jarvis-android
          path: dist/

  publish:
    name: pubblicazione della release
    if: inputs.automatico || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Imposta la versione automatica per la verifica
        if: inputs.automatico
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/stamp_release.py "$TAG"
      - name: Tag coerente con la versione del Core
        id: tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "tag non valido: $TAG"; exit 1; }
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' core/server/Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "il tag $TAG non corrisponde alla versione $version"; exit 1; }
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Verifica dei pacchetti e impronte SHA-256
        working-directory: dist
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${TAG#v}"
          installers=("JARVIS_${version}_aarch64.dmg" "JARVIS_${version}_x64-setup.exe" "JARVIS_${version}_android-release.apk")
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#installers[@]}"
          for installer in "${installers[@]}"; do test -s "$installer"; done
          sha256sum -- "${installers[@]}" > SHA256SUMS
          cat SHA256SUMS
      # Firma senza chiavi da custodire (ADR-0020): attestazione di provenienza di GitHub per ogni installer e
      # firma Sigstore dell'elenco delle impronte, legate a questo workflow e a questo commit.
      - name: Attestazione di provenienza degli installer
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*_android-release.apk
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Firma e verifica Sigstore dei pacchetti e delle impronte
        working-directory: dist
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          for file in *.dmg *-setup.exe *_android-release.apk SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
      - name: Release pubblica con installer, impronte e firme
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          AUTOMATIC: ${{ inputs.automatico }}
          NATIVE_SIGNING: ${{ inputs.automatico || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
          REPLACE: ${{ inputs.sostituisci && 'true' || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "$REPLACE" = "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "sostituzione della release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
            sleep 5
          fi
          remote=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [ -n "$remote" ]; then
            existing=$(printf '%s\n' "$remote" | tail -1 | cut -f1)
            test "$existing" = "$(git rev-parse HEAD)" || { echo "::error::Il tag appartiene a un altro commit"; exit 1; }
            if [ "$AUTOMATIC" = "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
          fi
          extra=""
          case "$TAG" in *-*) extra="--prerelease" ;; esac
          # Con l'avvio manuale il tag non esiste ancora: lo crea qui sul commit costruito (via git, così un
          # rifiuto riporta la regola che lo blocca), poi la release usa il tag esistente.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$(git rev-parse HEAD)"
            git push origin "refs/tags/$TAG" || {
              echo "::error::push del tag $TAG rifiutato; regole attive:"
              gh api "repos/$GITHUB_REPOSITORY/rulesets" || true
              exit 1
            }
          fi
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          cp .github/release-notes.md "$notes"
          if [ "$NATIVE_SIGNING" = "true" ]; then
            printf '\nFirma nativa autofirmata verificata su macOS e Windows; per eseguire le app occorre considerare attendibile il certificato sul proprio dispositivo.\n' >> "$notes"
          else
            printf '\nI pacchetti di prova sono firmati con Sigstore e attestati da GitHub Actions; le firme native autofirmate sono applicate solo alle release.\n' >> "$notes"
          fi
          release_notes="$(<"$notes")"
          gh release create "$TAG" dist/* --verify-tag --notes "$release_notes" --generate-notes --title "JARVIS $TAG" $extra --repo "$GITHUB_REPOSITORY" || {
            echo "::error::creazione della release rifiutata; diagnosi:"
            gh api "repos/$GITHUB_REPOSITORY/rulesets" || true
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=3" --jq '.[].tag_name' || true
            exit 1
          }
      - name: Mantieni una sola release pubblicata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prune_releases.py "$GITHUB_REPOSITORY"
