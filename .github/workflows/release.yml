name: release

# Programmi di installazione per Linux (.deb, .AppImage), macOS (.dmg) e Windows (.msi, setup .exe), con Core,
# runtime AI e Python autonomo inclusi (ADR-0016). Ogni installer viene installato davvero sul runner (Linux e
# Windows; su macOS l'app copiata dal .dmg montato) e il Core installato supera la prova di avvio.
# Con un tag vX.Y.Z pubblica la release con installer e impronte (decisione del proprietario del 2026-11-17); i tag con suffisso, es. v1.0.0-rc.1, restano prerelease.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["scripts/fetch_python.py", ".github/workflows/release.yml", "apps/desktop/**", "core/server/src/main.rs", "core/server/src/rollback.rs"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da creare e pubblicare (es. v0.1.0): deve corrispondere alla versione del Core. Vuoto = solo archivi"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: installer (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64, bundles: "deb,appimage" }
          - { os: macos-latest, target: macos-aarch64, bundles: "dmg" }
          - { os: windows-latest, target: windows-x86_64, bundles: "msi,nsis" }
    runs-on: ${{ matrix.os }}
    env:
      JARVIS_AI_BACKEND: offline
      PYTHONDONTWRITEBYTECODE: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Core in modalità release, incluso come sidecar
        shell: bash
        run: |
          (cd core && cargo build --release --locked -p jarvis-core)
          triple=$(rustc -vV | sed -n 's/host: //p')
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          cp "core/target/release/jarvis$ext" "apps/desktop/src-tauri/binaries/jarvis-core-$triple$ext"
          echo "TRIPLE=$triple" >> "$GITHUB_ENV"
      - name: Python autonomo con le dipendenze del runtime AI
        shell: bash
        run: |
          python scripts/fetch_python.py --triple "$TRIPLE" --dest apps/desktop/src-tauri/python
          if [ "$RUNNER_OS" = "Windows" ]; then py=apps/desktop/src-tauri/python/python.exe; else py=apps/desktop/src-tauri/python/bin/python3; fi
          "$py" -m pip install --disable-pip-version-check -q -r tests/contracts/requirements.txt
          python scripts/fetch_python.py --triple "$TRIPLE" --dest apps/desktop/src-tauri/python --trim
          "$py" -c "import jsonschema, sys; print('Python incluso', sys.version.split()[0])"
          du -sh apps/desktop/src-tauri/python apps/desktop/src-tauri/binaries || true
          find apps/desktop/src-tauri/python -type l | head -5 | grep . && { echo "collegamenti simbolici residui"; exit 1; } || true
      - name: La voce si installa con il Python incluso (come fa la configurazione guidata)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=apps/desktop/src-tauri/python/python.exe; else py=apps/desktop/src-tauri/python/bin/python3; fi
          "$py" -m pip install --disable-pip-version-check -q --target "$RUNNER_TEMP/voce" -r ai/requirements-voice.txt
          PYTHONPATH="$RUNNER_TEMP/voce" "$py" -c "import faster_whisper, piper, openwakeword, onnxruntime; print('pacchetti della voce importati')"
      - name: Programmi di installazione (Tauri)
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --config tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
      - name: Installazione reale e avvio del Core installato (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -i apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          root=$(dirname "$(dirname "$(dirname "$(dpkg -L jarvis | grep 'jarvis_ai/worker.py$')")")")
          echo "risorse installate in $root"
          test -x /usr/bin/jarvis-core || { echo "manca /usr/bin/jarvis-core"; exit 1; }
          test -x "$root/python/bin/python3" || { echo "manca $root/python/bin/python3"; ls -la "$root/python/bin" | head; exit 1; }
          JARVIS_HOME="$root" JARVIS_PYTHON="$root/python/bin/python3" JARVIS_DATA_DIR="$RUNNER_TEMP/dati" /usr/bin/jarvis-core > core.log 2>&1 &
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 120 || { cat core.log; exit 1; }
      - name: Installazione dal .dmg e avvio del Core installato (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$RUNNER_TEMP/dmg/JARVIS.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          app="$RUNNER_TEMP/Applications/JARVIS.app"
          res="$app/Contents/Resources"
          test -x "$app/Contents/MacOS/jarvis-core" && test -x "$res/python/bin/python3"
          JARVIS_HOME="$res" JARVIS_PYTHON="$res/python/bin/python3" JARVIS_DATA_DIR="$RUNNER_TEMP/dati" "$app/Contents/MacOS/jarvis-core" > core.log 2>&1 &
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 120 || { cat core.log; exit 1; }
      - name: Installazione reale (MSI) e avvio del Core installato (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi)[0].FullName
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "$env:RUNNER_TEMP\msi.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 50; exit 1 }
          $core = Get-ChildItem -Path "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" -Recurse -Filter jarvis-core.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $core) { Write-Host "jarvis-core.exe non trovato dopo l'installazione"; exit 1 }
          $root = $core.DirectoryName
          if (-not (Test-Path "$root\python\python.exe")) { Write-Host "Python incluso assente in $root"; exit 1 }
          $env:JARVIS_HOME = $root; $env:JARVIS_PYTHON = "$root\python\python.exe"; $env:JARVIS_DATA_DIR = "$env:RUNNER_TEMP\dati"
          Start-Process -FilePath $core.FullName -RedirectStandardOutput core.log -RedirectStandardError core.err -NoNewWindow
          python tests/smoke/start_smoke.py http://127.0.0.1:8765 120
          if ($LASTEXITCODE -ne 0) { Get-Content core.log, core.err; exit 1 }
      - name: Installer e impronte SHA-256
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -type f -exec cp {} dist/ \;
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.target }}
          path: dist/

  publish:
    name: pubblicazione della release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag coerente con la versione del Core
        id: tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "tag non valido: $TAG"; exit 1; }
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' core/server/Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "il tag $TAG non corrisponde alla versione $version"; exit 1; }
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release pubblica con archivi e impronte SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          extra=""
          case "$TAG" in *-*) extra="--prerelease" ;; esac
          # Con l'avvio manuale il tag non esiste ancora: lo crea qui sul commit costruito (via git, così un
          # rifiuto riporta la regola che lo blocca), poi la release usa il tag esistente.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" || {
              echo "::error::push del tag $TAG rifiutato; regole attive:"
              gh api "repos/$GITHUB_REPOSITORY/rulesets" || true
              exit 1
            }
          fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "JARVIS $TAG" $extra --repo "$GITHUB_REPOSITORY" || {
            echo "::error::creazione della release rifiutata; diagnosi:"
            gh api "repos/$GITHUB_REPOSITORY/rulesets" || true
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=3" --jq '.[].tag_name' || true
            exit 1
          }
