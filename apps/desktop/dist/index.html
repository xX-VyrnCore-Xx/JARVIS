<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a111c;
      --text: #f1f6ff;
      --muted: #abc0d5;
      --accent: #76e5ee;
      --violet: #9eaeff;
      --bad: #ff9db2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); overscroll-behavior: none; }
    body {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px; overflow-wrap: anywhere;
      background: radial-gradient(ellipse at 50% 43%, #182f48, var(--bg) 68%);
      color: var(--text); text-align: center;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100%, 510px); animation: arrive .65s cubic-bezier(.2,.75,.2,1) both; }
    .reactor { position: relative; display: grid; place-items: center; width: clamp(112px, 42vmin, 204px); aspect-ratio: 1; margin: 0 auto clamp(12px, 5vmin, 32px); }
    .reactor span { position: absolute; inset: 0; border-radius: 50%; }
    .frame { border: 1px solid #76e5ee32; box-shadow: inset 0 0 30px #76e5ee16; }
    .track {
      background: repeating-conic-gradient(from -90deg, #76e5ee70 0 1deg, transparent 1deg 7.5deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px), #000 calc(100% - 1px), transparent 100%);
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px), #000 calc(100% - 1px), transparent 100%);
    }
    .reactor .arc {
      inset: 10%; padding: 3px;
      background: conic-gradient(from 20deg, transparent 10%, var(--accent) 19% 30%, transparent 39% 58%, var(--violet) 69% 76%, transparent 85%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px), #000 calc(100% - 1px), transparent 100%);
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px), #000 calc(100% - 1px), transparent 100%);
      animation: orbit 3.2s linear infinite;
    }
    .reactor .inner { inset: 22%; border: 1px solid #9eaeff40; background: radial-gradient(circle at 50% 36%, #314f684d, #0b182b 75%); }
    .reactor .core {
      position: relative; inset: auto; width: 32%; aspect-ratio: 1; border-radius: 0;
      background: linear-gradient(147deg, #e4feff 10%, var(--accent) 53%, var(--violet) 97%);
      clip-path: polygon(50% 0, 94% 25%, 94% 75%, 50% 100%, 6% 75%, 6% 25%, 50% 0, 50% 15%, 19% 33%, 19% 67%, 50% 85%, 81% 67%, 81% 33%, 50% 15%);
      animation: glow 2.4s ease-in-out infinite;
    }
    h1 { margin: 0; padding-left: .17em; font-size: clamp(2rem, 8vmin, 3.45rem); font-weight: 720; letter-spacing: .17em; line-height: 1.1; }
    #status { margin: .62rem 0 0; color: var(--muted); }
    .activity { width: min(9rem, 100%); height: 3px; margin: 1.15rem auto 0; border-radius: 2px; overflow: hidden; background: #76e5ee25; }
    .activity::after { content: ""; display: block; width: 45%; height: 100%; background: linear-gradient(90deg, var(--violet), var(--accent)); border-radius: inherit; animation: scan 1.6s ease-in-out infinite; }
    #error { color: var(--bad); white-space: pre-wrap; text-align: left; border: 1px solid #ff9db266; border-radius: 12px; padding: .8rem 1rem; margin-top: 1rem; background: #ff9db212; }
    .failed .activity { display: none; }
    .failed .arc, .failed .core { animation: none; background: var(--bad); }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } }
    @keyframes orbit { to { transform: rotate(1turn); } }
    @keyframes glow { 50% { transform: scale(.89); opacity: .68; } }
    @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(225%); } }
    @media (prefers-reduced-motion: reduce) {
      main, .reactor .arc, .reactor .core, .activity::after { animation: none; }
    }
  </style>
  <script src="loading.js" defer></script>
</head>
<body>
  <main>
    <div class="reactor" aria-hidden="true"><span class="frame"></span><span class="track"></span><span class="arc"></span><span class="inner"></span><span class="core"></span></div>
    <h1>JARVIS</h1>
    <p id="status" role="status">Avvio del Core locale…</p>
    <div class="activity" aria-hidden="true"></div>
    <div id="error" role="alert" hidden></div>
  </main>
</body>
</html>
