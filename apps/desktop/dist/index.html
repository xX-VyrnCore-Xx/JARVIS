<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS</title>
  <style>
    :root { color-scheme: dark; --bg: #050a14; --text: #e3f4ff; --muted: #7f9bb3; --accent: #3fd0ff; --accent-2: #7b61ff; --bad: #ff5c7a; }
    html, body { height: 100%; margin: 0; }
    body { background: radial-gradient(ellipse at 50% 35%, #0b2340 0%, var(--bg) 65%); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; }
    body::before { content: ""; position: fixed; inset: 0; background-image: linear-gradient(rgba(63,208,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(63,208,255,.06) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(circle at 50% 40%, #000 0, transparent 70%); }
    main { position: relative; text-align: center; padding: 16px; max-width: 560px; }
    .reactor { position: relative; width: 132px; height: 132px; margin: 0 auto 1.4rem; }
    .reactor i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; }
    .reactor .r1 { border-top-color: var(--accent); border-right-color: var(--accent); animation: spin 1.6s linear infinite; filter: drop-shadow(0 0 6px var(--accent)); }
    .reactor .r2 { inset: 14px; border-bottom-color: var(--accent-2); border-left-color: var(--accent-2); animation: spin 2.4s linear infinite reverse; }
    .reactor .r3 { inset: 28px; border: 1px dashed rgba(63,208,255,.45); animation: spin 8s linear infinite; }
    .reactor .core { inset: 42px; background: radial-gradient(circle at 40% 35%, #e9fbff, var(--accent) 45%, #06345a 80%); box-shadow: 0 0 30px var(--accent), 0 0 70px rgba(63,208,255,.35); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { transform: scale(.9); opacity: .8; } }
    h1 { font-family: "Rajdhani", "Segoe UI Variable Display", -apple-system, sans-serif; letter-spacing: .4em; font-size: 1.9rem; font-weight: 600; margin: 0 0 .2rem; padding-left: .4em; text-shadow: 0 0 18px rgba(63,208,255,.55); }
    p { color: var(--muted); margin: .3rem 0; letter-spacing: .04em; }
    .bar { width: 220px; height: 2px; margin: 1rem auto 0; background: rgba(63,208,255,.15); overflow: hidden; border-radius: 2px; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scan 1.4s ease-in-out infinite; }
    @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #error { display: none; color: var(--bad); white-space: pre-wrap; text-align: left; border: 1px solid var(--bad); border-radius: 12px; padding: .8rem 1rem; margin-top: 1rem; background: rgba(255,92,122,.08); user-select: text; }
    body.failed .reactor i, body.failed .bar::after { animation: none; }
    body.failed .reactor .core { background: radial-gradient(circle, #ffd3dc, var(--bad) 60%, #4a0d1a); box-shadow: 0 0 30px var(--bad); }
    body.failed .bar { display: none; }
    @media (prefers-reduced-motion: reduce) { .reactor i, .bar::after { animation: none !important; } }
  </style>
  <script src="loading.js" defer></script>
</head>
<body>
  <main>
    <div class="reactor" aria-hidden="true"><i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="core"></i></div>
    <h1>JARVIS</h1>
    <p id="status">Avvio del Core locale…</p>
    <div class="bar" aria-hidden="true"></div>
    <div id="error" role="alert"></div>
  </main>
</body>
</html>
