[package]
name = "jarvis-desktop"
version = "1.13.1"
description = "JARVIS desktop nativo (egui)"
edition = "2021"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
publish = false

# Workspace separato: le dipendenze grafiche non appesantiscono la build del Core.
[workspace]

[dependencies]
jarvis-launcher = { path = "../launcher" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
notify-rust = "4.19"
