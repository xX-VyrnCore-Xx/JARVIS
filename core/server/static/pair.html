<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Associa il dispositivo — JARVIS</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0f1115">
  <script src="/pair.js" defer></script>
</head>
<body class="pair-page">
  <main class="pair-box">
    <h1>JARVIS</h1>
    <p class="hint">Apri l’invito ricevuto oppure inserisci il codice generato nella sezione <strong>Dispositivi</strong> del computer. Scegli un nome e conferma l’associazione. Il codice è monouso e scade dopo 10 minuti.</p>
    <form id="pair-form" class="form">
      <label>Codice di associazione <input name="code" required autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="ABCD-EFGH"></label>
      <label>Nome del dispositivo <input name="name" required maxlength="80" placeholder="Telefono"></label>
      <button type="submit" class="primary">Associa</button>
      <p class="hint" id="pair-error" role="alert"></p>
    </form>
  </main>
</body>
</html>
