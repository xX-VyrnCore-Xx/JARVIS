[package]
name = "jarvis-core"
version = "1.1.0"
description = "Core JARVIS: API locale, orchestrazione, policy, strumenti, memoria e audit (prototipo v0.1)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jarvis"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
jarvis-bridge = { path = "../bridge" }
jarvis-contracts = { path = "../contracts" }
jsonschema = { version = "0.30", default-features = false }
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tar = "0.4"
getrandom = "0.2"
futures-util = { version = "0.3", default-features = false }
hmac = "0.12"
ureq = "2"
url = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

# Portachiavi del sistema per la chiave dei segreti (ADR-0021); su Linux resta il file 0600.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
